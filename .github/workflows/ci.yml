name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Verify explicit-any regression guard
        run: pnpm verify:explicit-any

      # Workspace packages resolve each other via their published dist entry
      # points, so a build must exist before typecheck/tests on a fresh
      # checkout (typecheck also implies tsc for every package).
      - name: Verify coherent Lexical engine pins including the playground
        run: pnpm verify:lexical

      - name: Test benchmark and package contract guards
        run: node --test scripts/*.node-test.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Critical-module coverage evidence
        run: pnpm test:coverage

      - name: Upload critical-module coverage
        uses: actions/upload-artifact@v4
        with:
          name: studio-critical-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14

      - name: Build documentation with locked dependencies
        run: pnpm docs:build

      - name: Verify package exports
        run: pnpm verify:package-exports

      - name: Smoke ESM/CJS consumers, SSR and CSS export paths
        run: pnpm verify:consumer-imports

      - name: Strict clean installed consumer (Bundler)
        run: pnpm verify:packed-consumer

      - name: Strict clean installed consumer (NodeNext)
        run: pnpm verify:packed-consumer --strict-nodenext

      - name: Measure document pipeline (not browser INP)
        run: pnpm benchmark:document | tee document-pipeline-benchmark.json

      - name: Upload document pipeline baseline
        uses: actions/upload-artifact@v4
        with:
          name: studio-document-pipeline-${{ github.sha }}
          path: document-pipeline-benchmark.json
          retention-days: 14

      - name: Security regression tests
        run: pnpm test:security

      - name: Accessibility tests
        run: pnpm test:a11y

      # Fetch the separate host checkout only AFTER all recursive Vitest,
      # coverage and security/a11y discovery. Otherwise Vitest collects the
      # host's unrelated tests without its own dependencies and fails.
      # Cross-repository evidence is pinned to the exact immutable
      # CMS candidate baseline (v1.2.0-beta.1).
      - name: Checkout pinned CMS release baseline (v1.2.0-beta.1)
        uses: actions/checkout@v4
        with:
          repository: AbdullahZaher/vibress
          ref: 3344f83f30dd23205abb596f4320857f4611812a
          path: .cms-g2-source
          persist-credentials: false

      - name: Verify persisted v1 fixtures against exact CMS release HEAD
        run: |
          test "$(git -C .cms-g2-source rev-parse HEAD)" = "3344f83f30dd23205abb596f4320857f4611812a"
          node scripts/verify-host-compatibility.mjs --host .cms-g2-source --ref 3344f83f30dd23205abb596f4320857f4611812a



  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported desktop browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build packages (dist)
        run: pnpm build

      - name: Browser E2E (editor, cards, uploads, XSS, import/export, a11y, Lighthouse)
        run: pnpm test:e2e

      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-evidence-${{ github.sha }}
          path: test-results/
          retention-days: 14

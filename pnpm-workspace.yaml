packages:
  - 'packages/*'
  - 'playground'

# pnpm 11 gates dependency build scripts via `allowBuilds` (the v10
# `onlyBuiltDependencies` array is accepted but not applied). esbuild must run
# its postinstall to install the platform binary or the build/E2E toolchain
# fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
